schema: arcvellum/builtin-style-preset/v1
preset_id: clear-plain-zh
style_id: arcvellum-clear-plain-prose
author_id: arcvellum
profile_id: clear-plain-prose
display_name: 清简叙事
description: 以清晰叙事为底、随人物与场景压力变换句法和语域的中文通用基础文风。
scope: project
priority: highest
auto_mount_for_new_studio_projects: true
source_mode: user-supplied-public-domain-or-original-reference-corpus
theory_basis:
  - 句法与语域变化服务意义、视角、人物声音和场景转折
  - 具体主语与准确动词优先
  - 细节必须改变读者理解
  - 标点先表达结构与停顿，再表达风格节奏
prompt_contract:
  stable_prefix:
    - identity-and-boundary
    - instruction-priority
    - positive-style-mechanism
  scene_execution:
    - character-drive-and-cost
    - dominant-expression-channel
    - narrative-distance-and-rhythm
    - scene-language-contour
    - adjacent-scene-difference
    - ending-mode
    - causal-quantitative-detail
  scene_adaptation:
    - transition
    - conflict
    - relationship
    - revelation
    - aftermath
  silent_execution_passes:
    - scene-specific-style-strategy
    - prose-generation
    - hard-language-boundary-check
    - quantitative-detail-semantic-check
  exception_policy: sparse-functional-and-semantically-justified
  review_boundary: hard-language-rules-rechecked-soft-style-already-generated
  output_boundary: prose-only
