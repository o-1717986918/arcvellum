name: ArcVellum desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify signing configuration
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required for a release build."
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install -e ".[api,test]"
          python -m pip install "pyinstaller==6.21.0"
          npm ci
          npm run pi-worker:install

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = python -c "from literary_engineering_studio import __version__; print(__version__)"
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($version.Trim() -ne $tag) {
            throw "Tag $tag does not match package version $version."
          }

      # API integration tests intentionally exercise the built static client
      # and discover the compiled source-checkout Pi Worker. Build and test
      # those owned artifacts before the Python integration contract suite.
      - name: Test Vue client
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run client:test
          npm run client:build

      - name: Test embedded Pi Worker
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm run pi-worker:check

      - name: Test Python and prompt contracts
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # GitHub's default Windows TEMP may use an 8.3 alias (RUNNER~1)
          # while pathlib resolves descendants through the long runneradmin
          # path. RUNNER_TEMP has one canonical spelling.
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          python -m unittest discover -s tests -v
          python -m compileall -q src
          python scripts/architecture_audit.py
          python scripts/generate_module_map.py --check
          python scripts/verify_version_sync.py
          python -m literary_engineering_studio_engine prompt-registry-validate --json
          # Live model evaluation is intentionally opt-in. A release runner has no
          # user-managed provider connection, so only deterministic prompt-contract
          # regressions may block a signed installer release.
          python -m literary_engineering_studio prompt-eval --output dist/prompt-evaluation.json

      # The Tauri build requires the frozen Python sidecar, which is generated
      # by build_desktop.ps1 and intentionally not tracked in Git. That script
      # performs the authoritative Rust/Tauri compile after producing it.

      - name: Build signed updater and installer
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./packaging/build_desktop.ps1 -SkipPythonInstall -SkipNodeInstall

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArcVellum-${{ github.ref_name }}-windows-x64
          path: dist/release/*
          if-no-files-found: error

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            artifact: macos-arm64-preview
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: macos-x64-preview
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install build dependencies
        run: |
          python -m pip install -e ".[api,test]"
          python -m pip install "pyinstaller==6.21.0"
          npm ci
          npm run pi-worker:install
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(PYTHONPATH=src python -c 'from literary_engineering_studio import __version__; print(__version__)')"
          test "$version" = "${GITHUB_REF_NAME#v}"
      - name: Build macOS preview package
        run: bash packaging/build_desktop_macos.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ArcVellum-${{ github.ref_name }}-${{ matrix.artifact }}
          path: dist/release/*.dmg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${{ github.ref_name }}.md"
          test -f "$notes"
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" dist/release-assets/* --clobber
          else
            gh release create "${{ github.ref_name }}" dist/release-assets/* --title "ArcVellum ${{ github.ref_name }}" --notes-file "$notes"
          fi
