name: ArcVellum continuous integration

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Studio test dependencies
        run: python -m pip install -e ".[api,test]"
      - name: Verify formal contracts
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q src
          python scripts/verify_version_sync.py
          python -m literary_engineering_studio_engine prompt-registry-validate --json

  vue-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install and verify client
        run: |
          npm ci
          npm run client:test
          npm run client:build

  desktop-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Tauri shell compilation
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
