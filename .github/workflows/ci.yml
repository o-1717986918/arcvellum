name: ArcVellum continuous integration

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build the static UI required by API contract tests
        run: |
          npm ci
          npm run client:build
      - name: Install Studio test dependencies
        run: python -m pip install -e ".[api,test]"
      - name: Verify formal contracts
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q src
          python scripts/verify_version_sync.py
          python -m literary_engineering_studio_engine prompt-registry-validate --json

  vue-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install and verify client
        run: |
          npm ci
          npm run client:test
          npm run client:build

  desktop-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: dtolnay/rust-toolchain@stable
      - name: Freeze the sidecar required by the Tauri resource contract
        shell: pwsh
        run: |
          python -m pip install -e ".[api,test]"
          python -m pip install "pyinstaller==6.21.0"
          python -m PyInstaller --noconfirm --clean packaging/studio_sidecar.spec
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          Copy-Item -Force dist/literary-engineering-studio-sidecar.exe desktop/src-tauri/binaries/literary-engineering-studio-sidecar-x86_64-pc-windows-msvc.exe
          python -m literary_engineering_studio opencode-install --destination build/vendor/opencode-v1.18.3/expanded
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/resources | Out-Null
          Copy-Item -Force build/vendor/opencode-v1.18.3/expanded/opencode.exe desktop/src-tauri/resources/opencode.exe
          Copy-Item -Force build/vendor/opencode-v1.18.3/expanded/opencode-installation.json desktop/src-tauri/resources/opencode-installation.json
          Copy-Item -Force src/literary_engineering_studio/vendor/OPENCODE-NOTICE.md desktop/src-tauri/resources/OPENCODE-NOTICE.md
          Copy-Item -Force src/literary_engineering_studio/vendor/OPENCODE-LICENSE.txt desktop/src-tauri/resources/OPENCODE-LICENSE.txt
      - name: Check Tauri shell compilation against the frozen resource
        shell: pwsh
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
