name: ArcVellum continuous integration

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build the static UI required by API contract tests
        run: |
          npm ci
          npm run client:build
          # Python integration tests verify that a source checkout can locate
          # the compiled bounded Worker. Build that artifact in this job rather
          # than relying on another job's isolated workspace.
          npm run pi-worker:install
          npm run pi-worker:build
      - name: Install Studio test dependencies
        run: python -m pip install -e ".[api,test]"
      - name: Verify formal contracts
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q src
          python scripts/architecture_audit.py
          python scripts/generate_module_map.py --check
          python scripts/verify_version_sync.py
          python -m literary_engineering_studio_engine prompt-registry-validate --json

  vue-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install and verify client
        run: |
          npm ci
          npm run client:test
          npm run client:build

  pi-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: workers/pi-worker/package-lock.json
      - name: Install, compile, and test the bounded Pi Worker
        run: |
          npm --prefix workers/pi-worker ci --ignore-scripts
          npm run pi-worker:check

  desktop-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: workers/pi-worker/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Freeze the sidecar required by the Tauri resource contract
        shell: pwsh
        run: |
          python -m pip install -e ".[api,test]"
          python -m pip install "pyinstaller==6.21.0"
          python -m PyInstaller --noconfirm --clean packaging/studio_sidecar.spec
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          Copy-Item -Force dist/literary-engineering-studio-sidecar.exe desktop/src-tauri/binaries/literary-engineering-studio-sidecar-x86_64-pc-windows-msvc.exe
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/resources | Out-Null
          python packaging/pi_worker_bundle.py stage --root . --destination desktop/src-tauri/resources/pi-worker --cache-root build/vendor/node-v22.19.0 --target windows-x64
      - name: Check Tauri shell compilation against the frozen resource
        shell: pwsh
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml

  desktop-shell-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            pi_target: macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            pi_target: macos-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Prepare the native sidecar and embedded Pi Worker
        run: |
          python -m pip install -e ".[api,test]"
          python -m pip install "pyinstaller==6.21.0"
          npm ci
          npm run pi-worker:install
          npm run client:build
          python -m PyInstaller --noconfirm --clean packaging/studio_sidecar.spec
          mkdir -p desktop/src-tauri/binaries desktop/src-tauri/resources
          cp dist/literary-engineering-studio-sidecar "desktop/src-tauri/binaries/literary-engineering-studio-sidecar-${{ matrix.target }}"
          chmod +x "desktop/src-tauri/binaries/literary-engineering-studio-sidecar-${{ matrix.target }}"
          python packaging/pi_worker_bundle.py stage --root . --destination desktop/src-tauri/resources/pi-worker --cache-root build/vendor/node-v22.19.0 --target "${{ matrix.pi_target }}"
      - name: Check the macOS Tauri shell
        run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml --target "${{ matrix.target }}"
